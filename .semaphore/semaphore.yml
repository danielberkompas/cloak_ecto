version: "v1.0"
name: "CI Build"

agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004

auto_cancel:
  running:
    when: "true"

fail_fast:
  stop:
    when: "true"

blocks:
  - name: "Build"
    dependencies: []
    task:
      env_vars:
        - name: MIX_ENV
          value: test
        - name: DATABASE_URL
          value: postgresql://postgres@localhost/test?encoding=utf8
      secrets:
        - name: cloak-ecto-coveralls
      jobs:
        - name: "Build"
          matrix:
            - env_var: VERSION_PAIR
              values:
                - "1.12.1:23.3"
                - "1.13.4:24.0"
                - "1.16.0:25.0"
                - "1.16.0:26.0"
                - "1.19.5:28.4"
          commands:
            - export ELIXIR_VERSION="${VERSION_PAIR%:*}" ERLANG_VERSION="${VERSION_PAIR#*:}"
            - sem-version erlang $ERLANG_VERSION
            - sem-version elixir $ELIXIR_VERSION
            - sem-service start postgres
            - checkout
            # - cache restore
            - mix local.hex --force
            - mix local.rebar --force
            - mix deps.get
            - bin/test
            # - cache store
